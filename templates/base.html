<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="{{ url_for('static', filename='img/mail_icon.png') }}" type="image/png">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{title}}</title>
</head>
<body>
<header>
    <nav class="navbar navbar-light bg-light">
        <a class="navbar-brand" href="http://127.0.0.1:5000/">
            <img src="{{ url_for('static', filename='img/MailWorld.png') }}" alt="buttonpng" border="0" width="250" height="50"/>
        </a>
        <div style="display: flex; justify-content: flex-end;">
            {% if current_user.is_authenticated %}
                <a class="navbar-brand" href="/logout">{{ current_user.name }}</a>
                <button class="image-button" onclick="window.location='/settings'">
                    <img src="{{ url_for('static', filename='img/settings.png') }}" alt="buttonpng" border="0" width="25" height="25"/>
                </button>
            {% else %}
                <button class="example pinterest left-button" onclick="window.location='/register'">
                    Регистрация
                </button>
                <button class="example pinterest" onclick="window.location='/login'">Войти</button>
            {% endif %}
        </div>
    </nav>
</header>
<!-- Begin page content -->
<main role="main" class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
